<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>다각형 기둥형 3D 사다리 게임</title>
<style>
  :root{
    --bg:#0b1020; --panel:rgba(18,24,48,.82); --line:rgba(255,255,255,.12);
    --text:#e8ecff; --muted:#9aa6d1; --accent:#ffc857; --accent2:#6ea8ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;overflow:hidden}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  canvas#c:active{cursor:grabbing}
  #panel{position:fixed;top:12px;left:12px;width:min(370px,calc(100vw - 24px));max-height:calc(100vh - 24px);
    overflow:auto;background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;z-index:5;
    box-shadow:0 10px 40px rgba(0,0,0,.4)}
  #panel.collapsed .body{display:none}
  .head{display:flex;align-items:flex-start;gap:8px;justify-content:space-between}
  h1{font-size:17px;margin:0 0 4px;line-height:1.3}
  .sub{font-size:12.5px;color:var(--muted);margin:0 0 12px;line-height:1.5}
  #toggle{background:transparent;border:1px solid var(--line);color:var(--text);border-radius:8px;
    width:32px;height:32px;cursor:pointer;font-size:16px;flex:none}
  label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 5px}
  input[type=text],input[type=number]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
    background:rgba(255,255,255,.06);color:var(--text);font-size:14px;outline:none}
  input[type=text]:focus,input[type=number]:focus{border-color:var(--accent2)}
  button.btn{cursor:pointer;border:0;border-radius:10px;padding:10px 12px;font-size:13.5px;font-weight:700;
    color:#1a1a1a;background:linear-gradient(135deg,#ffd978,#ffb347)}
  button.btn.sec{background:rgba(255,255,255,.08);color:var(--text);font-weight:600;border:1px solid var(--line)}
  button.btn:hover{filter:brightness(1.1)}
  #gen{width:100%;margin-top:14px;padding:12px;font-size:15px}
  #msg{font-size:12px;color:#ffb3b3;margin-top:8px;min-height:0}
  #msg.info{color:var(--muted)}
  #game{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .row{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .chip{cursor:pointer;border:2px solid;border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;
    background:rgba(255,255,255,.05);color:var(--text)}
  .chip.used{opacity:.45}
  .chip:hover{background:rgba(255,255,255,.14)}
  .sect{font-size:12px;color:var(--muted);margin:12px 0 4px}
  #list{list-style:none;padding:0;margin:6px 0 0;font-size:13.5px}
  #list li{display:flex;align-items:center;gap:8px;padding:5px 2px;border-bottom:1px dashed var(--line)}
  #list .dot{width:10px;height:10px;border-radius:50%;flex:none}
  #list .res{margin-left:auto;font-weight:800}
  #list .res.hid{color:var(--muted);font-weight:500}
  .opt{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin:6px 0}
  .opt input[type=range]{flex:1}
  .hint{position:fixed;right:14px;bottom:12px;font-size:12px;color:var(--muted);
    background:rgba(0,0,0,.35);padding:6px 10px;border-radius:8px;z-index:4;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="panel">
  <div class="head">
    <div>
      <h1>다각형 기둥형 3D 사다리 게임</h1>
      <p class="sub">밑면 다각형에서 기둥이 일자로 쭉 뻗은 뒤, 상단에서 사다리 타기가 진행됩니다!</p>
    </div>
    <button id="toggle" title="패널 접기/펼치기">–</button>
  </div>
  <div class="body">
    <label for="names">참가자 이름 (쉼표로 구분)</label>
    <input type="text" id="names" value="민수, 지영, 철수, 하나, 도윤">
    <label for="results">결과 항목 (쉼표로 구분)</label>
    <input type="text" id="results" value="커피, 꽝, 점심, 청소, 박수">
    <label for="rungCount">사다리 가로선 개수 (1~150)</label>
    <input type="number" id="rungCount" value="12" min="1" max="150" step="1" inputmode="numeric">
    <button class="btn" id="gen">3D 사다리 생성하기</button>
    <div id="msg"></div>

    <div id="game" hidden>
      <div class="sect">참가자를 눌러 출발시키세요</div>
      <div class="row" id="chips"></div>
      <div class="row">
        <button class="btn" id="runAll">전체 출발</button>
        <button class="btn sec" id="revealAll">결과 모두 보기</button>
        <button class="btn sec" id="resetRun">초기화</button>
        <button class="btn sec" id="reshuffle">사다리 다시 섞기</button>
      </div>
      <div class="sect">시점</div>
      <div class="row">
        <button class="btn sec" data-view="all">전체</button>
        <button class="btn sec" data-view="ladder">사다리 구간</button>
        <button class="btn sec" data-view="top">위에서</button>
        <button class="btn sec" data-view="base">밑면</button>
      </div>
      <div class="opt"><span>속도</span><input type="range" id="speed" min="3" max="18" value="8"></div>
      <div class="opt"><label style="margin:0;display:flex;gap:6px;align-items:center"><input type="checkbox" id="follow" checked> 공 따라가기</label>
        <label style="margin:0 0 0 10px;display:flex;gap:6px;align-items:center"><input type="checkbox" id="auto" checked> 자동 회전</label></div>
      <ul id="list"></ul>
    </div>
  </div>
</div>
<div class="hint">드래그: 회전 · 휠/핀치: 확대·축소</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  const $ = id => document.getElementById(id);
  const canvas = $('c');
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b1020);
  scene.fog = new THREE.Fog(0x0b1020, 45, 130);
  const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 400);

  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dl = new THREE.DirectionalLight(0xffffff, 0.9); dl.position.set(10, 25, 12); scene.add(dl);
  const pl = new THREE.PointLight(0x88aaff, 0.7, 120); pl.position.set(-8, 14, -8); scene.add(pl);

  const grid = new THREE.GridHelper(80, 40, 0x24305c, 0x161e3b);
  grid.position.y = -0.26; scene.add(grid);

  let world = new THREE.Group(); scene.add(world);

  const UP = new THREE.Vector3(0,1,0);
  const unitCyl = new THREE.CylinderGeometry(1,1,1,10,1,false);
  const ballGeo = new THREE.SphereGeometry(0.24, 24, 16);
  const FONT = "'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',sans-serif";

  function colorOf(i, n){ return new THREE.Color().setHSL((i / n) % 1, 0.8, 0.62); }
  function cssOf(i, n){ return `hsl(${Math.round(360*i/n)},80%,62%)`; }

  function setSeg(mesh, a, b, r){
    const dir = new THREE.Vector3().subVectors(b, a);
    const len = dir.length();
    if (len < 1e-6){ mesh.scale.set(0,0,0); return; }
    mesh.position.copy(a).addScaledVector(dir, 0.5);
    mesh.quaternion.setFromUnitVectors(UP, dir.normalize());
    mesh.scale.set(r, len, r);
  }
  function segMesh(a, b, r, mat){
    const m = new THREE.Mesh(unitCyl, mat);
    setSeg(m, a, b, r);
    return m;
  }

  // ----- Label sprites -----
  function makeLabel(w){
    const c = document.createElement('canvas'); c.width = 512; c.height = 160;
    const tex = new THREE.CanvasTexture(c);
    const mat = new THREE.SpriteMaterial({map: tex, transparent: true, depthTest: false});
    const spr = new THREE.Sprite(mat);
    spr.scale.set(w||3.2, (w||3.2)*160/512, 1);
    spr.renderOrder = 10;
    function draw(main, color, sub, dim){
      const ctx = c.getContext('2d');
      ctx.clearRect(0,0,512,160);
      ctx.fillStyle = dim ? 'rgba(20,26,52,.78)' : 'rgba(10,14,32,.82)';
      const x=6,y=6,ww=500,hh=148,r=28;
      ctx.beginPath();
      ctx.moveTo(x+r,y); ctx.arcTo(x+ww,y,x+ww,y+hh,r); ctx.arcTo(x+ww,y+hh,x,y+hh,r);
      ctx.arcTo(x,y+hh,x,y,r); ctx.arcTo(x,y,x+ww,y,r); ctx.closePath(); ctx.fill();
      ctx.lineWidth = 6; ctx.strokeStyle = color; ctx.stroke();
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      let size = sub ? 62 : 74;
      ctx.fillStyle = '#fff';
      do { ctx.font = `bold ${size}px ${FONT}`; size -= 3; } while (ctx.measureText(main).width > 440 && size > 20);
      ctx.fillText(main, 256, sub ? 62 : 80);
      if (sub){
        ctx.fillStyle = color; ctx.font = `600 34px ${FONT}`;
        let t = '▲ ' + sub;
        while (ctx.measureText(t).width > 440 && t.length > 3) t = t.slice(0,-2);
        ctx.fillText(t, 256, 120);
      }
      tex.needsUpdate = true;
    }
    return {sprite: spr, draw};
  }

  // ----- Game state -----
  const S = {
    names: [], results: [], N: 0, rows: 0, rungs: [], pos: [], R: 1,
    yStart: 9, gap: 0.55, yTop: 20, topLabels: [], runners: {}, revealed: {}, final: []
  };

  function parseList(str){
    return str.split(/[,，、\n]/).map(s => s.trim()).filter(Boolean);
  }
  function shuffle(a){
    for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
    return a;
  }

  function genRungs(){
    const N = S.N, rows = S.rows, K = S.K;
    const pairs = [];
    for (let i=0;i<N;i++){ if (N===2 && i===1) break; pairs.push([i,(i+1)%N]); }
    const rungs = Array.from({length: rows}, () => []);
    const usedRow = Array.from({length: rows}, () => new Array(N).fill(false));
    let placed = 0;
    const tryPlace = (r, a, b) => {
      if (usedRow[r][a] || usedRow[r][b]) return false;
      for (const rr of [r-1, r+1]){   // 바로 위/아래 줄에 같은 가로선이 겹치지 않게
        if (rungs[rr] && rungs[rr].some(p => p[0]===a && p[1]===b)) return false;
      }
      usedRow[r][a] = usedRow[r][b] = true;
      rungs[r].push([a,b]); placed++;
      return true;
    };
    // 개수가 충분하면 모든 인접 기둥 사이에 최소 1개씩 배치
    if (K >= pairs.length){
      for (const [a,b] of shuffle(pairs.slice())){
        for (const r of shuffle([...Array(rows).keys()])){ if (tryPlace(r,a,b)) break; }
      }
    }
    // 나머지는 무작위로 정확히 K개가 될 때까지 배치
    let guard = 0;
    while (placed < K && guard < 30000){
      guard++;
      const r = Math.floor(Math.random()*rows);
      const [a,b] = pairs[Math.floor(Math.random()*pairs.length)];
      tryPlace(r, a, b);
    }
    S.rungs = rungs; S.placed = placed;
  }

  function pathFor(s){
    const pts = [];
    let cur = s;
    pts.push(new THREE.Vector3(S.pos[cur].x, 0.2, S.pos[cur].z));
    for (let r=0;r<S.rows;r++){
      const rung = S.rungs[r].find(p => p[0]===cur || p[1]===cur);
      if (rung){
        const y = S.yStart + (r+1)*S.gap;
        const nxt = rung[0]===cur ? rung[1] : rung[0];
        pts.push(new THREE.Vector3(S.pos[cur].x, y, S.pos[cur].z));
        pts.push(new THREE.Vector3(S.pos[nxt].x, y, S.pos[nxt].z));
        cur = nxt;
      }
    }
    pts.push(new THREE.Vector3(S.pos[cur].x, S.yTop + 0.3, S.pos[cur].z));
    return {pts, end: cur};
  }

  function clearWorld(){
    scene.remove(world);
    world.traverse(o => {
      if (o.isSprite){ if (o.material.map) o.material.map.dispose(); o.material.dispose(); }
      else if (o.isMesh && o.geometry !== unitCyl && o.geometry !== ballGeo){ o.geometry.dispose(); }
      else if (o.isLine || o.isLineSegments || o.isLineLoop){ o.geometry.dispose(); }
    });
    world = new THREE.Group(); scene.add(world);
    S.runners = {}; S.revealed = {}; S.topLabels = [];
  }

  function build(){
    clearWorld();
    const N = S.N;
    S.rows = Math.max(8, Math.ceil(S.K / Math.max(1, Math.floor(N/2)) * 1.8));
    S.R = N===2 ? 1.2 : 1.2/Math.sin(Math.PI/N);
    S.yStart = 9;
    S.gap = 0.55;
    S.yTop = S.yStart + (S.rows+1)*S.gap + 1.5;
    S.pos = [];
    for (let i=0;i<N;i++){
      const a = 2*Math.PI*i/N;
      S.pos.push({x: S.R*Math.sin(a), z: S.R*Math.cos(a)});
    }
    genRungs();
    S.final = [];
    for (let i=0;i<N;i++) S.final.push(pathFor(i).end);

    const R = S.R, yTop = S.yTop;

    // 밑면 / 기둥(프리즘) 외형
    const plateMat = new THREE.MeshStandardMaterial({color:0x27325f, metalness:.3, roughness:.5});
    if (N>=3){
      const plate = new THREE.Mesh(new THREE.CylinderGeometry(R+0.01,R+0.01,0.3,N), plateMat);
      plate.position.y = -0.15; world.add(plate);
      const faces = new THREE.Mesh(
        new THREE.CylinderGeometry(R,R,yTop,N,1,true),
        new THREE.MeshBasicMaterial({color:0x6ea8ff, transparent:true, opacity:0.07, side:THREE.DoubleSide, depthWrite:false})
      );
      faces.position.y = yTop/2; world.add(faces);
      const edges = new THREE.LineSegments(new THREE.EdgesGeometry(faces.geometry, 1),
        new THREE.LineBasicMaterial({color:0x7f96d8, transparent:true, opacity:0.35}));
      edges.position.y = yTop/2; world.add(edges);
    } else {
      const plate = new THREE.Mesh(new THREE.BoxGeometry(1.6,0.3,2*R+1.2), plateMat);
      plate.position.y = -0.15; world.add(plate);
    }

    // 사다리 구간 경계 링
    const ringPts = () => S.pos.map(p => new THREE.Vector3(p.x, 0, p.z));
    [S.yStart, S.yStart + (S.rows+1)*S.gap].forEach(y => {
      const g = new THREE.BufferGeometry().setFromPoints(ringPts().map(v => v.setY(y)));
      const ring = N>=3 ? new THREE.LineLoop(g, new THREE.LineBasicMaterial({color:0xffc857, transparent:true, opacity:.35}))
                        : new THREE.Line(g, new THREE.LineBasicMaterial({color:0xffc857, transparent:true, opacity:.35}));
      world.add(ring);
    });

    // 기둥
    const pillarMat = new THREE.MeshStandardMaterial({color:0x9fb2e8, metalness:.4, roughness:.35, emissive:0x16204a});
    for (let i=0;i<N;i++){
      const a = new THREE.Vector3(S.pos[i].x, 0, S.pos[i].z);
      const b = new THREE.Vector3(S.pos[i].x, yTop, S.pos[i].z);
      world.add(segMesh(a, b, 0.07, pillarMat));
      const cap = new THREE.Mesh(new THREE.SphereGeometry(0.16,16,12), pillarMat);
      cap.position.copy(b); world.add(cap);
    }

    // 가로대
    const rungMat = new THREE.MeshStandardMaterial({color:0xffc857, emissive:0x5a3a00, metalness:.2, roughness:.4});
    for (let r=0;r<S.rows;r++){
      const y = S.yStart + (r+1)*S.gap;
      for (const [a,b] of S.rungs[r]){
        const A = new THREE.Vector3(S.pos[a].x, y, S.pos[a].z);
        const B = new THREE.Vector3(S.pos[b].x, y, S.pos[b].z);
        world.add(segMesh(A, B, 0.05, rungMat));
      }
    }

    // 라벨: 밑면(참가자), 상단(결과)
    for (let i=0;i<N;i++){
      const out = new THREE.Vector3(S.pos[i].x, 0, S.pos[i].z);
      if (out.lengthSq() < 1e-6) out.set(0,0,1);
      out.normalize();
      const cs = cssOf(i, N);
      const nl = makeLabel(3.0);
      nl.draw(S.names[i], cs, null);
      nl.sprite.position.set(S.pos[i].x + out.x*1.1, 0.6, S.pos[i].z + out.z*1.1);
      world.add(nl.sprite);

      const sm = new THREE.Mesh(new THREE.SphereGeometry(0.2,16,12), new THREE.MeshStandardMaterial({color:colorOf(i,N), emissive:colorOf(i,N), emissiveIntensity:.6}));
      sm.position.set(S.pos[i].x, 0.2, S.pos[i].z); world.add(sm);

      const tl = makeLabel(3.0);
      tl.draw('?', '#7f8bb5', null, true);
      tl.sprite.position.set(S.pos[i].x + out.x*0.3, yTop + 1.2, S.pos[i].z + out.z*0.3);
      world.add(tl.sprite);
      S.topLabels.push(tl);
    }

    buildUI();
    setView('all', true);
  }

  // ----- UI -----
  function buildUI(){
    $('game').hidden = false;
    const chips = $('chips'); chips.innerHTML = '';
    S.names.forEach((nm,i) => {
      const b = document.createElement('button');
      b.className = 'chip'; b.id = 'chip'+i; b.textContent = nm;
      b.style.borderColor = cssOf(i, S.N);
      b.onclick = () => startRunner(i);
      chips.appendChild(b);
    });
    const ul = $('list'); ul.innerHTML = '';
    S.names.forEach((nm,i) => {
      const li = document.createElement('li');
      const d = document.createElement('span'); d.className='dot'; d.style.background = cssOf(i,S.N);
      const n = document.createElement('span'); n.textContent = nm;
      const r = document.createElement('span'); r.className='res hid'; r.id='res'+i; r.textContent='?';
      li.append(d,n,r); ul.appendChild(li);
    });
  }

  function reveal(s){
    if (S.revealed[s]) return;
    S.revealed[s] = true;
    const end = S.final[s];
    S.topLabels[end].draw(S.results[end], cssOf(s,S.N), S.names[s]);
    const el = $('res'+s);
    el.textContent = S.results[end]; el.classList.remove('hid');
    el.style.color = cssOf(s,S.N);
  }

  // ----- Runners -----
  function startRunner(s){
    if (S.runners[s]) return;
    const {pts} = pathFor(s);
    const cum = [0];
    for (let k=1;k<pts.length;k++) cum.push(cum[k-1] + pts[k].distanceTo(pts[k-1]));
    const color = colorOf(s, S.N);
    const ball = new THREE.Mesh(ballGeo, new THREE.MeshStandardMaterial({color, emissive:color, emissiveIntensity:.95}));
    ball.position.copy(pts[0]);
    const light = new THREE.PointLight(color, 0.8, 7); ball.add(light);
    const trailMat = new THREE.MeshBasicMaterial({color});
    const partial = new THREE.Mesh(unitCyl, trailMat);
    const grp = new THREE.Group(); grp.add(ball, partial); world.add(grp);
    S.runners[s] = {s, pts, cum, total: cum[cum.length-1], dist:0, idx:0, ball, partial, trailMat, grp, done:false};
    $('chip'+s).classList.add('used');
  }

  function updateRunners(dt){
    const speed = +$('speed').value;
    let followY = null;
    for (const key in S.runners){
      const r = S.runners[key];
      if (r.done) continue;
      r.dist = Math.min(r.dist + speed*dt, r.total);
      while (r.idx < r.pts.length-2 && r.dist >= r.cum[r.idx+1]){
        r.grp.add(segMesh(r.pts[r.idx], r.pts[r.idx+1], 0.05, r.trailMat));
        r.idx++;
      }
      const a = r.pts[r.idx], b = r.pts[r.idx+1];
      const segLen = r.cum[r.idx+1] - r.cum[r.idx];
      const t = segLen > 0 ? Math.min(1, Math.max(0, (r.dist - r.cum[r.idx]) / segLen)) : 1;
      const p = new THREE.Vector3().lerpVectors(a, b, t);
      r.ball.position.copy(p);
      setSeg(r.partial, a, p, 0.05);
      if (followY === null) followY = p.y;
      if (r.dist >= r.total){
        r.done = true;
        r.grp.remove(r.partial);
        r.grp.add(segMesh(a, b, 0.05, r.trailMat));
        reveal(r.s);
      }
    }
    if (followY !== null && $('follow').checked){
      goal.ty = Math.max(2, Math.min(S.yTop, followY));
    }
  }

  function resetRun(){
    for (const key in S.runners){
      const r = S.runners[key];
      world.remove(r.grp);
      r.grp.traverse(o => { if (o.isMesh && o.geometry !== unitCyl && o.geometry !== ballGeo) o.geometry.dispose(); });
    }
    S.runners = {}; S.revealed = {};
    for (let i=0;i<S.N;i++){
      $('chip'+i).classList.remove('used');
      const el = $('res'+i); el.textContent='?'; el.classList.add('hid'); el.style.color='';
    }
    S.topLabels.forEach(tl => tl.draw('?', '#7f8bb5', null, true));
  }

  // ----- Camera -----
  const cam  = {theta:0.8, phi:1.2, dist:30, ty:10};
  const goal = {theta:0.8, phi:1.2, dist:30, ty:10};
  let dragging = false;

  function setView(name, instant){
    const N = S.N, R = S.R, top = S.yTop;
    const ladderMid = S.yStart + (S.rows+1)*S.gap/2;
    if (name === 'all'){ goal.ty = top*0.5; goal.dist = top*1.25 + R + 4; goal.phi = 1.25; }
    if (name === 'ladder'){ goal.ty = ladderMid; goal.dist = Math.max(R*3.4, 11) + S.rows*0.28; goal.phi = 1.3; }
    if (name === 'top'){ goal.ty = top; goal.dist = R*3.4 + 7; goal.phi = 0.35; }
    if (name === 'base'){ goal.ty = 2; goal.dist = R*3.6 + 8; goal.phi = 1.05; }
    if (instant){ Object.assign(cam, goal); }
  }

  function applyCam(){
    const sp = Math.sin(cam.phi);
    camera.position.set(
      cam.dist*sp*Math.sin(cam.theta),
      cam.ty + cam.dist*Math.cos(cam.phi),
      cam.dist*sp*Math.cos(cam.theta)
    );
    camera.lookAt(0, cam.ty, 0);
  }

  const pointers = new Map();
  let pinchStart = 0, distStart = 0;
  canvas.addEventListener('pointerdown', e => {
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    dragging = true;
    if (pointers.size === 2){
      const [a,b] = [...pointers.values()];
      pinchStart = Math.hypot(a.x-b.x, a.y-b.y); distStart = goal.dist;
    }
  });
  canvas.addEventListener('pointermove', e => {
    const p = pointers.get(e.pointerId); if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    if (pointers.size === 1){
      goal.theta -= dx*0.008;
      goal.phi = Math.min(1.75, Math.max(0.12, goal.phi - dy*0.006));
    } else if (pointers.size === 2){
      const [a,b] = [...pointers.values()];
      const d = Math.hypot(a.x-b.x, a.y-b.y);
      if (pinchStart > 0) goal.dist = Math.min(90, Math.max(5, distStart * pinchStart / d));
    }
  });
  const endPtr = e => { pointers.delete(e.pointerId); if (!pointers.size) dragging = false; };
  canvas.addEventListener('pointerup', endPtr);
  canvas.addEventListener('pointercancel', endPtr);
  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    goal.dist = Math.min(90, Math.max(5, goal.dist * (1 + e.deltaY*0.001)));
  }, {passive:false});

  // ----- Controls -----
  function generate(keepInputs){
    const msg = $('msg'); msg.textContent = ''; msg.className = '';
    if (!keepInputs){
      let names = parseList($('names').value);
      let results = parseList($('results').value);
      if (names.length < 2){ msg.textContent = '참가자는 2명 이상 입력해 주세요.'; return; }
      const notes = [];
      if (names.length > 12){ names = names.slice(0,12); notes.push('참가자는 최대 12명까지 지원해 12명으로 줄였어요.'); }
      if (results.length < names.length){
        notes.push(`결과 항목이 부족해 ${names.length - results.length}칸을 "꽝"으로 채웠어요.`);
        while (results.length < names.length) results.push('꽝');
      } else if (results.length > names.length){
        notes.push('결과 항목이 참가자 수보다 많아 앞에서부터 사용해요.');
        results = results.slice(0, names.length);
      }
      let k = parseInt($('rungCount').value, 10);
      if (!Number.isFinite(k)){ msg.textContent = '가로선 개수를 숫자로 입력해 주세요.'; return; }
      if (k < 1){ k = 1; notes.push('가로선은 최소 1개로 맞췄어요.'); }
      if (k > 150){ k = 150; notes.push('가로선은 최대 150개로 맞췄어요.'); }
      $('rungCount').value = k;
      if (notes.length){ msg.textContent = notes.join(' '); msg.className = 'info'; }
      S.names = names; S.results = results; S.N = names.length; S.K = k;
    }
    build();
  }

  $('gen').onclick = () => generate(false);
  $('reshuffle').onclick = () => generate(true);
  $('resetRun').onclick = resetRun;
  $('runAll').onclick = () => { for (let i=0;i<S.N;i++) startRunner(i); };
  $('revealAll').onclick = () => { for (let i=0;i<S.N;i++){ reveal(i); $('chip'+i).classList.add('used'); } };
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => setView(b.dataset.view));
  $('toggle').onclick = () => {
    const p = $('panel'); p.classList.toggle('collapsed');
    $('toggle').textContent = p.classList.contains('collapsed') ? '+' : '–';
  };
  ['names','results','rungCount'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key==='Enter') generate(false); }));

  // ----- Loop -----
  function resize(){
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w/h;
    camera.fov = w/h < 0.8 ? 62 : 50;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize); resize();

  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.05, (now-last)/1000); last = now;
    if ($('auto').checked && !dragging) goal.theta += dt*0.12;
    updateRunners(dt);
    const k = 1 - Math.pow(0.0006, dt);
    cam.theta += (goal.theta-cam.theta)*k;
    cam.phi   += (goal.phi-cam.phi)*k;
    cam.dist  += (goal.dist-cam.dist)*k;
    cam.ty    += (goal.ty-cam.ty)*k;
    applyCam();
    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }

  generate(false);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
